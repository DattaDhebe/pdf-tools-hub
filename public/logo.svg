<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer D shape (teal) -->
  <path d="M 150 100 L 250 100 Q 320 100 320 200 L 320 312 Q 320 412 250 412 L 150 412 Z" fill="none" stroke="url(#grad1)" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner D shape (white) -->
  <path d="M 190 140 L 250 140 Q 280 140 280 200 L 280 312 Q 280 372 250 372 L 190 372 Z" fill="none" stroke="white" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- S curve (yellow/gold) -->
  <path d="M 220 180 Q 340 200 340 256 Q 340 312 220 332" fill="none" stroke="url(#grad2)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow up (yellow/gold) -->
  <g transform="translate(380, 80)">
    <!-- Arrow shaft -->
    <line x1="0" y1="80" x2="0" y2="0" stroke="url(#grad2)" stroke-width="45" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="0,-20 -40,-80 40,-80" fill="url(#grad2)"/>
  </g>
</svg>